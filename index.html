<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#030811">
<title>ASIF PRANK WORLD</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{min-height:100dvh;background:#030811;color:#00ffc3;font-family:monospace;display:flex;align-items:center;justify-content:center;padding:18px;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none}
.app{width:100%;max-width:600px;text-align:center}.logo{font-size:48px;text-shadow:0 0 25px #00ffc3}
h1{font-size:clamp(25px,7vw,38px);letter-spacing:3px;text-shadow:0 0 15px #00ffc3}
.panel{background:#07131e;border:1px solid #087e69;border-radius:18px;padding:22px;box-shadow:0 0 30px #00ffc322}
.status{color:#b6d9d2;font-size:14px;margin:18px 0}.line{height:8px;background:#172b35;border-radius:20px;overflow:hidden;margin:18px 0}
#bar{height:100%;width:0;background:#00ffc3;box-shadow:0 0 15px #00ffc3}#percent{font-size:20px;margin:12px}
#log{height:120px;text-align:left;color:#9affd9;line-height:1.9;overflow:hidden;font-size:13px}
#count{font-size:clamp(75px,22vw,130px);font-weight:bold;text-shadow:0 0 30px #00ffc3}
#surprise{font-size:clamp(28px,8vw,45px);color:#fff;text-shadow:0 0 20px #ff00c8}
.hidden{display:none!important}#nameScreen{padding:28px 22px}#nameScreen p{color:#b6d9d2;line-height:1.7;font-size:15px}
#guestName{width:100%;padding:15px;border-radius:12px;border:1px solid #087e69;background:#020a12;color:#fff;font-size:18px;text-align:center;outline:none;margin:14px 0}
#startBtn{width:100%;padding:15px;border:0;border-radius:12px;background:#00ffc3;color:#03110e;font-weight:bold;font-size:17px}
#voiceStatus{color:#9affd9;font-size:13px;min-height:36px;line-height:1.6;margin-top:14px}
</style>
</head>
<body>
<audio id="music" src="./prank-song.mp3" preload="auto" playsinline loop></audio>
<div class="app">
 <div id="nameScreen" class="panel"><div class="logo">❤️</div><h1>ASIF PRANK WORLD</h1><p>শুরু করার আগে তোমার নামটা লিখো 😊</p>
 <input id="guestName" type="text" maxlength="30" placeholder="তোমার নাম" autocomplete="name">
 <button id="startBtn" type="button">শুরু করো ❤️</button><div id="voiceStatus"></div></div>
 <div id="checking" class="hidden"><div class="logo">◈</div><h1>SYSTEM CHECK</h1>
 <div class="panel"><div class="status" id="status">INITIALIZING SYSTEM...</div><div class="line"><div id="bar"></div></div><div id="percent">0%</div><div id="log"></div></div></div>
 <div id="final" class="hidden"><div class="logo">⚡</div><div id="count">3</div><div id="surprise"></div></div>
</div>
<script>
let started=false,voiceFailed=false;
const music=document.getElementById('music'),voiceStatus=document.getElementById('voiceStatus');
function tryFullscreen(){const el=document.documentElement;if(!document.fullscreenElement&&el.requestFullscreen)el.requestFullscreen().catch(()=>{});}
function buzz(){if('vibrate'in navigator)navigator.vibrate(100);}
function startMusic(){if(!music.paused)return;music.muted=false;music.volume=1;const p=music.play();if(p&&p.catch)p.catch(()=>{const s=document.getElementById('status');if(s)s.textContent='TAP TO ENABLE MUSIC';});}
function begin(){
 if(started)return;started=true;document.getElementById('checking').classList.remove('hidden');startMusic();tryFullscreen();
 const bar=document.getElementById('bar'),percent=document.getElementById('percent'),status=document.getElementById('status'),log=document.getElementById('log');
 const messages=['Initializing system...','Loading visual interface...','Checking display...','Preparing final sequence...','Final sequence ready...'];let p=0,i=0;
 const timer=setInterval(()=>{p=Math.min(100,p+2);bar.style.width=p+'%';percent.textContent=p+'%';if(p%20===0&&i<messages.length){log.textContent+='> '+messages[i]+'\\n';status.textContent=messages[i].toUpperCase();i++;}if(p>=100){clearInterval(timer);setTimeout(countdown,500);}},90);
}
function countdown(){
 document.getElementById('checking').classList.add('hidden');document.getElementById('final').classList.remove('hidden');let n=3;document.getElementById('count').textContent=n;
 const timer=setInterval(()=>{n--;if(n>0)document.getElementById('count').textContent=n;else{clearInterval(timer);document.getElementById('count').classList.add('hidden');document.getElementById('surprise').textContent='😂 SURPRISE!';}},1000);
}
function detectNameGender(name){
 const n=name.toLowerCase().replace(/[^a-z\u0980-\u09ff]/g,'');
 const male=['asif','mdasif','rahim','karim','sakib','shakib','tamim','fahim','rakib','shuvo','sajib','tanvir','nahid','imran','arif','rafi','hasan','hossain','riyad','rohan','emon','siyam','saim','sajid','mahmud','abdullah','মোহাম্মদ','আসিফ','রহিম','করিম','সাকিব','শাকিব','তামিম','ফাহিম','রাকিব','শুভ','সাজিব','তানভীর','নাহিদ','ইমরান','আরিফ','রাফি','হাসান','হোসেন','রিয়াদ','রোহান','ইমন','সিয়াম','সাইম','সাজিদ','মাহমুদ','আব্দুল্লাহ'];
 const female=['sumaiya','sumiya','sumaya','ayesha','aysha','aisha','nusrat','jannat','mim','maria','sadia','sadia','sanjida','moumita','lamia','tania','tanjila','sabrina','fatema','faria','nabila','tasnim','maisha','maliha','safa','রিমা','সুমাইয়া','সুমাইয়া','আয়েশা','আয়েশা','আয়শা','নুসরাত','জান্নাত','মিম','মারিয়া','মারিয়া','সাদিয়া','সাদিয়া','সানজিদা','মৌমিতা','লামিয়া','লামিয়া','তানিয়া','তানিয়া','তানজিলা','সাবরিনা','ফাতেমা','ফারিয়া','ফারিয়া','নাবিলা','তাসনিম','মাইশা','মালিহা','সাফা'];
 if(male.some(x=>n.includes(x)))return 'male';
 if(female.some(x=>n.includes(x)))return 'female';
 return 'unknown';
}
function speakLines(name){
 music.pause();music.currentTime=0;
 if(!window.speechSynthesis||!window.SpeechSynthesisUtterance){voiceStatus.textContent='এই ব্রাউজারে ভয়েস সুবিধা নেই। ফোনে বাংলা Text-to-Speech চালু করতে হবে।';return;}
 const synth=window.speechSynthesis,gender=detectNameGender(name);
 const wanted=gender==='male'?'female':gender==='female'?'male':'female';
 const lines=['সোনা '+name+', কী করো?','সোনা, খাইছো?',name+', আমার কথা কি মনে পড়ে?','কী গো সোনা, একটু হাসো তো!','তোমার সাথে কথা বলতে খুব ভালো লাগছে।'];
 voiceFailed=false;synth.cancel();synth.resume();
 voiceStatus.textContent=gender==='unknown'?'নামটি বুঝে কণ্ঠ বেছে নেওয়ার চেষ্টা করছি… 🔊':(wanted==='female'?'মিষ্টি মেয়েলি কণ্ঠে':'ছেলেদের কণ্ঠে')+' কথা বলছি… 🔊';
 function startSpeaking(){
  const voices=synth.getVoices(),bn=voices.filter(v=>v.lang&&/^bn([-_]|$)/i.test(v.lang));
  const genderWords=wanted==='female'?/female|woman|girl|zira|samantha|susan|victoria|aria|jenny|নারী|মহিলা/i:/male|man|boy|david|daniel|alex|guy|পুরুষ/i;
  const selected=bn.find(v=>genderWords.test(v.name))||bn[0]||null;
  let index=0;
  function next(){
   if(voiceFailed)return;
   if(index>=lines.length){voiceStatus.textContent='কথা শেষ ❤️ একটু পর গান শুরু হবে… 🎵';setTimeout(()=>{if(!voiceFailed)begin();},1800);return;}
   const u=new SpeechSynthesisUtterance(lines[index++]);u.lang='bn-BD';if(selected)u.voice=selected;
   u.rate=0.86;u.pitch=wanted==='female'?1.32:0.82;u.volume=1;
   u.onend=()=>setTimeout(next,450);
   u.onerror=()=>{voiceFailed=true;voiceStatus.textContent='ভয়েস চালু হয়নি। ফোনের বাংলা Text-to-Speech সেটিংস পরীক্ষা করো।';};
   synth.speak(u);
  }
  next();
 }
 if(synth.getVoices().length)startSpeaking();
 else{let done=false;const ready=()=>{if(done)return;done=true;synth.removeEventListener('voiceschanged',ready);startSpeaking();};synth.addEventListener('voiceschanged',ready);setTimeout(ready,1500);}
}
document.getElementById('startBtn').addEventListener('click',()=>{const name=document.getElementById('guestName').value.trim();if(!name){voiceStatus.textContent='আগে তোমার নাম লিখো';document.getElementById('guestName').focus();return;}document.getElementById('nameScreen').classList.add('hidden');buzz();speakLines(name);});
document.getElementById('guestName').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('startBtn').click();});
document.addEventListener('pointerdown',()=>{buzz();if(started&&music.paused)startMusic();},{passive:true});
</script>
</body>
</html>
