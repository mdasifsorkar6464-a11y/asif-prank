<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#030811">
<title>System Check</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
 min-height:100dvh;background:#030811;color:#00ffc3;
 font-family:monospace;display:flex;align-items:center;
 justify-content:center;padding:18px;touch-action:manipulation;
 -webkit-tap-highlight-color:transparent;user-select:none;
}
.app{width:100%;max-width:600px;text-align:center}
.logo{font-size:48px;text-shadow:0 0 25px #00ffc3}
h1{font-size:clamp(25px,7vw,38px);letter-spacing:3px;text-shadow:0 0 15px #00ffc3}
.panel{
 background:#07131e;border:1px solid #087e69;border-radius:18px;
 padding:22px;box-shadow:0 0 30px #00ffc322;
}
.status{color:#b6d9d2;font-size:14px;margin:18px 0}
.line{height:8px;background:#172b35;border-radius:20px;overflow:hidden;margin:18px 0}
#bar{height:100%;width:0;background:#00ffc3;box-shadow:0 0 15px #00ffc3}
#percent{font-size:20px;margin:12px}
#log{height:120px;text-align:left;color:#9affd9;line-height:1.9;overflow:hidden;font-size:13px}
#count{font-size:clamp(75px,22vw,130px);font-weight:bold;text-shadow:0 0 30px #00ffc3}
#surprise{font-size:clamp(28px,8vw,45px);color:#fff;text-shadow:0 0 20px #ff00c8}
.hidden{display:none}
</style>
</head>
<body>
<audio id="music" src="./prank-song.mp3" preload="auto" playsinline loop></audio>
<div class="app">
 <div id="checking">
  <div class="logo">◈</div>
  <h1>SYSTEM CHECK</h1>
  <div class="panel">
   <div class="status" id="status">INITIALIZING SYSTEM...</div>
   <div class="line"><div id="bar"></div></div>
   <div id="percent">0%</div>
   <div id="log"></div>
  </div>
 </div>
 <div id="final" class="hidden">
  <div class="logo">⚡</div>
  <div id="count">3</div>
  <div id="surprise"></div>
 </div>
</div>
<script>
let started=false, vibrateAt=0;
const music=document.getElementById('music');
function tryFullscreen(){
 const el=document.documentElement;
 if(!document.fullscreenElement && el.requestFullscreen){
  el.requestFullscreen().catch(()=>{});
 }
}
function buzz(){
 if('vibrate' in navigator) navigator.vibrate(100);
}
function startMusic(){
 if(!music.paused) return;
 music.muted=false;
 music.volume=1;
 const attempt=music.play();
 if(attempt && typeof attempt.catch==='function'){
  attempt.catch(()=>{
   const status=document.getElementById('status');
   if(status) status.textContent='TAP AGAIN TO ENABLE SOUND';
  });
 }
}
function begin(){
 if(started) return;
 started=true;
 startMusic();
 tryFullscreen();
 const bar=document.getElementById('bar');
 const percent=document.getElementById('percent');
 const status=document.getElementById('status');
 const log=document.getElementById('log');
 const messages=[
  'Initializing system...',
  'Loading visual interface...',
  'Checking display...',
  'Preparing final sequence...',
  'Final sequence ready...'
 ];
 let p=0,i=0;
 const timer=setInterval(()=>{
  p=Math.min(100,p+2);
  bar.style.width=p+'%';
  percent.textContent=p+'%';
  if(p%20===0 && i<messages.length){
   log.textContent+='> '+messages[i]+'\n';
   status.textContent=messages[i].toUpperCase();
   i++;
  }
  if(p>=100){
   clearInterval(timer);
   setTimeout(countdown,500);
  }
 },90);
}
function countdown(){
 document.getElementById('checking').classList.add('hidden');
 document.getElementById('final').classList.remove('hidden');
 let n=3;
 document.getElementById('count').textContent=n;
 const timer=setInterval(()=>{
  n--;
  if(n>0) document.getElementById('count').textContent=n;
  else{
   clearInterval(timer);
   document.getElementById('count').classList.add('hidden');
   document.getElementById('surprise').textContent='😂 SURPRISE!';
  }
 },1000);
}
document.addEventListener('pointerdown',()=>{
 buzz();
 if(!started) begin();
 else if(music.paused) startMusic();
},{passive:true});
</script>
</body>
</html>
