<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#030811">
<title>ASIF PRANK WORLD</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{min-height:100dvh;background:#030811;color:#00ffc3;font-family:monospace;display:flex;align-items:center;justify-content:center;padding:18px;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none}
.app{width:100%;max-width:600px;text-align:center}
.logo{font-size:48px;text-shadow:0 0 25px #00ffc3}
h1{font-size:clamp(25px,7vw,38px);letter-spacing:3px;text-shadow:0 0 15px #00ffc3}
.panel{background:#07131e;border:1px solid #087e69;border-radius:18px;padding:22px;box-shadow:0 0 30px #00ffc322}
.status{color:#b6d9d2;font-size:14px;margin:18px 0}
.line{height:8px;background:#172b35;border-radius:20px;overflow:hidden;margin:18px 0}
#bar{height:100%;width:0;background:#00ffc3;box-shadow:0 0 15px #00ffc3}
#percent{font-size:20px;margin:12px}
#log{height:120px;text-align:left;color:#9affd9;line-height:1.9;overflow:hidden;font-size:13px}
#count{font-size:clamp(75px,22vw,130px);font-weight:bold;text-shadow:0 0 30px #00ffc3}
#surprise{font-size:clamp(28px,8vw,45px);color:#fff;text-shadow:0 0 20px #ff00c8}
.hidden{display:none!important}
#nameScreen{padding:28px 22px}
#nameScreen p{color:#b6d9d2;line-height:1.7;font-size:15px}
#guestName{width:100%;padding:15px;border-radius:12px;border:1px solid #087e69;background:#020a12;color:#fff;font-size:18px;text-align:center;outline:none;margin:14px 0}
#startBtn{width:100%;padding:15px;border:0;border-radius:12px;background:#00ffc3;color:#03110e;font-weight:bold;font-size:17px}
#voiceStatus{color:#9affd9;font-size:13px;min-height:22px;margin-top:14px}
</style>
</head>
<body>
<audio id="music" src="./prank-song.mp3" preload="auto" playsinline loop></audio>
<div class="app">
 <div id="nameScreen" class="panel">
  <div class="logo">❤️</div>
  <h1>ASIF PRANK WORLD</h1>
  <p>শুরু করার আগে তোমার নামটা লিখো 😊</p>
  <input id="guestName" type="text" maxlength="30" placeholder="তোমার নাম" autocomplete="name">
  <button id="startBtn" type="button">শুরু করো ❤️</button>
  <div id="voiceStatus"></div>
 </div>
 <div id="checking" class="hidden">
  <div class="logo">◈</div>
  <h1>SYSTEM CHECK</h1>
  <div class="panel">
   <div class="status" id="status">INITIALIZING SYSTEM...</div>
   <div class="line"><div id="bar"></div></div>
   <div id="percent">0%</div>
   <div id="log"></div>
  </div>
 </div>
 <div id="final" class="hidden">
  <div class="logo">⚡</div>
  <div id="count">3</div>
  <div id="surprise"></div>
 </div>
</div>
<script>
let started=false;
const music=document.getElementById('music');
const voiceStatus=document.getElementById('voiceStatus');
function tryFullscreen(){
 const el=document.documentElement;
 if(!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen().catch(()=>{});
}
function buzz(){if('vibrate' in navigator) navigator.vibrate(100);}
function startMusic(){
 if(!music.paused) return;
 music.muted=false; music.volume=1;
 const attempt=music.play();
 if(attempt && typeof attempt.catch==='function'){
  attempt.catch(()=>{
   const status=document.getElementById('status');
   if(status) status.textContent='TAP AGAIN TO ENABLE SOUND';
  });
 }
}
function begin(){
 if(started) return;
 started=true;
 document.getElementById('checking').classList.remove('hidden');
 startMusic(); tryFullscreen();
 const bar=document.getElementById('bar');
 const percent=document.getElementById('percent');
 const status=document.getElementById('status');
 const log=document.getElementById('log');
 const messages=['Initializing system...','Loading visual interface...','Checking display...','Preparing final sequence...','Final sequence ready...'];
 let p=0,i=0;
 const timer=setInterval(()=>{
  p=Math.min(100,p+2); bar.style.width=p+'%'; percent.textContent=p+'%';
  if(p%20===0 && i<messages.length){log.textContent+='> '+messages[i]+'\\n';status.textContent=messages[i].toUpperCase();i++;}
  if(p>=100){clearInterval(timer);setTimeout(countdown,500);}
 },90);
}
function countdown(){
 document.getElementById('checking').classList.add('hidden');
 document.getElementById('final').classList.remove('hidden');
 let n=3; document.getElementById('count').textContent=n;
 const timer=setInterval(()=>{
  n--;
  if(n>0) document.getElementById('count').textContent=n;
  else{clearInterval(timer);document.getElementById('count').classList.add('hidden');document.getElementById('surprise').textContent='😂 SURPRISE!';}
 },1000);
}
function speakLines(name){
 if(!('speechSynthesis' in window) || !('SpeechSynthesisUtterance' in window)){
  voiceStatus.textContent='ভয়েস সুবিধা নেই—প্র্যাঙ্ক শুরু হচ্ছে';
  setTimeout(begin,1200); return;
 }
 const lines=[
  'সোনা '+name+', কী করো?',
  'সোনা, খাইছো?',
  name+', আমার কথা কি মনে পড়ে?',
  'কী গো সোনা, একটু হাসো তো!',
  'তোমার সাথে কথা বলতে খুব ভালো লাগছে।'
 ];
 const voices=window.speechSynthesis.getVoices();
 const bnVoice=voices.find(v=>v.lang && v.lang.toLowerCase().startsWith('bn'));
 let index=0;
 function next(){
  if(index>=lines.length){voiceStatus.textContent='';begin();return;}
  const utterance=new SpeechSynthesisUtterance(lines[index++]);
  utterance.lang='bn-BD';
  if(bnVoice) utterance.voice=bnVoice;
  utterance.rate=0.92; utterance.pitch=1.12; utterance.volume=1;
  utterance.onend=next;
  utterance.onerror=next;
  window.speechSynthesis.speak(utterance);
 }
 voiceStatus.textContent='একটু কথা বলি তোমার সাথে… 🔊';
 next();
}
document.getElementById('startBtn').addEventListener('click',()=>{
 const name=document.getElementById('guestName').value.trim();
 if(!name){voiceStatus.textContent='আগে তোমার নাম লিখো';document.getElementById('guestName').focus();return;}
 document.getElementById('nameScreen').classList.add('hidden');
 startMusic(); buzz(); speakLines(name);
});
document.getElementById('guestName').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('startBtn').click();});
document.addEventListener('pointerdown',()=>{
 buzz();
 if(started && music.paused) startMusic();
},{passive:true});
</script>
</body>
</html>
